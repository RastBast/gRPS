syntax = "proto3";

package orders.v1;

import "google/protobuf/timestamp.proto";

message Order {
  int64 id = 1;
  string customer_name = 2;
  int64 total = 3;
  string status = 4; // Я думаю статов у нас бдует много так что лучше поствить стринг на будуще типо притянт полачен высылваем лежит на скалде клиет забрал  если все таки будет всего 2 стасуса сделан или нет то булл
  google.protobuf.Timestamp created_at = 5;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message CreateOrderRequest {
  string customer_name = 1;
  int64 total = 2;
}
message CreateOrderResponse {
  Order order = 1;
}
message GetOrdersRequest {}

message GetOrderResponse {
  Order order = 1;
}
message GetOrderRequest {
  int64 id = 1;
}

message GetOrdersResponse {
  repeated Order orders = 1;
}
